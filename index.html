<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wirelist & Cable Schedule Editor · Standalone Block Editor</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <style>
    .wirelist-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 40px);
      overflow: hidden;
    }

    .wirelist-header-bar {
      background: var(--osc-bg-surface);
      border-bottom: 1px solid var(--osc-border-default);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .search-box {
      width: 240px;
    }

    .telemetry-pill {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--osc-accent-primary);
      background: var(--osc-bg-input);
      border: 1px solid var(--osc-border-default);
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
    }

    .data-grid-panel {
      flex: 1;
      min-height: 0;
      background: var(--osc-bg-surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .data-table-container {
      flex: 1;
      overflow: auto;
    }

    .cell-input {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--osc-text-primary);
      padding: 4px 6px;
      font-size: 11px;
      border-radius: 2px;
      font-family: inherit;
    }

    .cell-input:focus {
      background: var(--osc-bg-input);
      border-color: var(--osc-accent-primary);
      outline: none;
    }

    .text-center {
      text-align: center;
    }

    .col-actions {
      width: 45px;
      text-align: center;
    }
    .discovered-panel {
      border-bottom: 1px solid var(--osc-border-default, var(--border-color));
      padding: 8px 14px;
      max-height: 40vh;
      overflow: auto;
    }

    .discovered-panel[hidden] { display: none; }

    .discovered-head {
      display: flex;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 6px;
      font-size: 12px;
    }

    [data-apk-state="good"] { color: var(--apk-state-good); }
    [data-apk-state="kinda"] { color: var(--apk-state-kinda); }
    [data-apk-state="dead"] { color: var(--apk-state-dead); }
  </style>
</head>
<body class="theme-deep-horizon">
  <header class="app-window-header">
    <div class="window-title-group">
      <span class="window-dot"></span>
      <span class="window-title">Wirelist & Cable Schedule Editor</span>
      <span class="window-pill" id="block-tag">STANDALONE BLOCK EDITOR</span>
    </div>
    <div class="window-actions">
      <button class="btn btn-secondary" id="btn-sync-discovered" title="Show what is on the network (the bus), live">
        <span class="btn-icon">⚡</span> Discovered
      </button>
      <button class="btn btn-secondary" id="btn-open" title="Open block JSON">
        <span class="btn-icon">📂</span> Open
      </button>
      <button class="btn btn-primary" id="btn-save" title="Save & Return modified block to caller">
        <span class="btn-icon">💾</span> Save & Return
      </button>
      <button class="btn btn-icon" id="btn-close" title="Close Editor">✕</button>
    </div>
  </header>

  <div class="wirelist-container">
    <div class="wirelist-header-bar">
      <div style="display:flex; align-items:center; gap:12px;">
        <input type="text" id="search-input" class="input search-box" placeholder="Filter cables by wire#, room, dev...">
        <div class="telemetry-pill" id="total-length">Total Length: 0 ft</div>
        <div class="telemetry-pill" id="total-count">0 Cable Runs</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-secondary btn-sm" id="btn-export">Export CSV</button>
        <button class="btn btn-primary btn-sm" id="btn-add-wire">+ Add Cable Run</button>
      </div>
    </div>

    <section id="discovered-panel" class="discovered-panel" hidden>
      <div class="discovered-head">
        <strong>On the network</strong>
        <span id="discovered-status" class="discovered-status" data-apk-state="kinda">Not started.</span>
      </div>
      <div id="discovered-table"></div>
    </section>

    <section class="data-grid-panel">
      <div class="data-table-container">
        <div id="wire-table"></div>
      </div>
    </section>
  </div>

  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="./js/wirelistApp.js"></script>
</body>
</html>
